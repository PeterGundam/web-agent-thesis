      - img "REI Co op membership"
      - heading "Annual Co-op Member Reward" [level=3]
      - paragraph: Each March, members get back an estimated 10%* on their yearly eligible full-price purchases to spend at the co-op. (Plus, members get special offers & coupons, no minimum free standard shipping, used gear buy & trade-in, shop service discounts and much more.)
      - paragraph: Membership lasts a lifetimejoin for $30 once, enjoy forever.
      - paragraph: "*A 10% Co-op Member Reward is typical but not guaranteed. Your Co-op Member Reward is based on eligible net qualified purchases, which exclude REI Outlet items, sale, clearance items, discounted items, gift cards, REI adventure travel, REI classes or day trips, service fees (e.g., rentals, labor), membership fee, postage, event tickets, passes or registrations, government agencies and sales tax."
