- heading "This is IKEA" [level=2]
- paragraph:
  - strong: Sustainable everyday
- paragraph: How sustainable is IKEA? Well, more sustainable every day. With products like veggie hot dogs, and energy-saving solutions, were paving the way for more sustainable homes for the many.
- paragraph: Learn more
- paragraph:
  - strong: Climate and environment
- paragraph: Find out how IKEA invests, inspires and acts to tackle environmental issues, reduce carbon footprints and drive positive change on a global scale.
- paragraph: Learn more
- paragraph:
  - strong: Work with us
- paragraph: Coming from all over the world, our IKEA co-workers share a special set of values and a vision to enable people to live a better, more sustainable everyday life. They come together within diverse, inclusive, open IKEA work environments, where each of them offers something unique.
- paragraph: Learn more
- heading "Furniture and inspiration for a better everyday life at home" [level=2]
- paragraph: Welcome to IKEA, where you will always find affordable furniture , stylish home dcor and innovative modern home solutions, as well as design inspiration and unique home ideas! If you are online furniture shopping or if you are visiting a local IKEA store near you, you can expect super low prices on a wide variety of exciting home essentials that are perfect for larger homes and small space living.
- paragraph: If you want to save even more money when you are shopping at IKEA, be sure to join IKEA Family so you can take advantage of our regular furniture sales, amazing deals on home furnishings and special offers on home accessories. Get ready for big savings whether you are refreshing your space with small upgrades, like new curtains or sheets, or planning bigger home renovation projects, like remodeling your kitchen or doing a DIY bathroom makeover!
- paragraph: So, now you are probably wondering, How do I find an IKEA furniture store near me? Check out the IKEA Store Locator and we hope to see you soon! IKEA also has many new ways to shop. Want to shop online from the comfort of your sofa? No problem, weve made shopping online at IKEA easier than ever. Browse our full store experience online to find affordable home goods for every room, including home office , living room , kitchen , bathroom , bedroom and outdoor furniture , and get deliveries straight to your doorstep! We also offer Click-and-collect where you can buy online and pick-up in store for even faster and easier shopping.
